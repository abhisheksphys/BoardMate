<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Live Board">
  <meta name="theme-color" content="#f6f5f2">
  <title>Live Board</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
      svg: { fontCache: 'none' },
      startup: { typeset: false },
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body class="panel-right">
  <header id="toolbar">
    <div class="group">
      <button id="sessionsBtn" title="Sessions" aria-label="Sessions">
        <svg viewBox="0 0 24 24"><rect x="4" y="7" width="14" height="13" rx="2"/><path d="M8 4h10a2 2 0 0 1 2 2v10"/></svg>
      </button>
      <span class="sep"></span>
      <button data-tool="pen" class="tool active" title="Pen (P)" aria-label="Pen">
        <svg viewBox="0 0 24 24"><path d="M4 20l1-5L16 4l4 4L9 19z"/><path d="M14 6l4 4"/></svg>
      </button>
      <span class="tool-split">
        <button data-tool="eraser" class="tool" title="Eraser (E) — tap again for size" aria-label="Eraser">
          <svg viewBox="0 0 24 24"><path d="M8 20h12"/><path d="M5 15l9-9 5 5-8 8H8z"/></svg>
        </button>
        <button id="eraserMore" class="more" title="Eraser size" aria-label="Eraser options"><svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg></button>
      </span>
      <button data-tool="select" class="tool" title="Select a region, or move and resize images and blocks (S)" aria-label="Select">
        <svg viewBox="0 0 24 24"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4" /></svg>
      </button>
      <button id="imgBtn" title="Insert an image" aria-label="Insert image">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>
      </button>
      <span class="sep"></span>
      <button id="colorBtn" class="ink-btn" title="Ink colour" aria-label="Ink colour"><span class="ink-dot"></span></button>
      <span id="recentColors"></span>
      <button id="widthBtn" class="ink-btn" title="Stroke thickness" aria-label="Stroke thickness"><svg viewBox="0 0 24 24"><path id="widthIcon" d="M4 16c3-6 6-8 8-4s5 2 8-4"/></svg></button>
      <span class="sep"></span>
      <button id="undo" title="Undo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 7H4V2"/><path d="M4 7a9 9 0 1 1-1 7"/></svg></button>
      <button id="redo" title="Redo" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="M15 7h5V2"/><path d="M20 7a9 9 0 1 0 1 7"/></svg></button>
    </div>
    <div class="group pages">
      <button id="sessionTitle" class="label session-title" title="Sessions">Session</button>
      <span class="sep"></span>
      <button id="pagePrev" aria-label="Previous page"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button id="pageLabel" class="label" title="Rename page">Page 1</button>
      <button id="pageNext" aria-label="Next page"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <button id="pageNew" title="New page" aria-label="New page"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div class="group">
      <select id="attention" title="How closely Claude watches">
        <option value="live">Live</option>
        <option value="quiet">Quiet live</option>
        <option value="demand">On demand</option>
      </select>
      <button id="micBtn" class="mic" aria-label="Microphone"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button id="voiceOutBtn" class="toggle" title="Spoken replies" aria-label="Spoken replies"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></button>
      <button id="panelBtn" title="Move or hide the panel" aria-label="Panel layout"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
      <button id="settingsBtn" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </header>

  <main id="stage">
    <div id="boardWrap">
      <canvas id="board"></canvas>
      <div id="aiChip" class="chip-float" hidden><span class="dot"></span><span>Claude is writing…</span><button id="stopBtn">Stop</button></div>
      <button id="askSel" class="chip-float ask-sel" hidden>Ask about the selection ↓</button>
      <div id="interim" hidden></div>
    </div>

    <div id="splitter" role="separator" tabindex="0" aria-label="Drag to resize the panel" title="Drag to resize · double-tap to reset"></div>

    <aside id="drawer" hidden>
      <div class="drawer-head">
        <b>Sessions</b>
        <button id="newSession" class="primary" type="button">+ New</button>
        <button id="drawerClose" class="ghost" type="button" aria-label="Close">✕</button>
      </div>
      <input id="sessionSearch" type="search" placeholder="Search titles, notes, equations…" autocomplete="off">
      <button id="askFind" class="ask-find" type="button" hidden>Ask Claude to find it</button>
      <div id="sessionChips" class="s-chips"></div>
      <div id="sessionList"></div>
      <div class="drawer-foot">
        <button id="branchCurrent" type="button" title="Copy this session to try a different approach">Branch this session</button>
        <button id="backupBtn" type="button">Back up</button>
        <button id="restoreBtn" type="button">Restore…</button>
        <input type="file" id="restoreFile" accept=".json,application/json" hidden>
      </div>
    </aside>

    <aside id="panel">
      <div id="panelHead">
        <span class="title">Claude</span>
        <span id="status"></span>
        <button id="matBtn" class="ghost small" title="PDFs for this session" aria-label="Session PDFs"><svg viewBox="0 0 24 24"><path d="M20 11l-8.5 8.5a5 5 0 0 1-7-7L13 4a3.3 3.3 0 0 1 4.7 4.7L9.2 17.2a1.7 1.7 0 0 1-2.4-2.4L14.5 7"/></svg><span id="matCount"></span></button>
        <button id="costBtn" class="ghost small" title="Spending today — tap for details">—</button>
        <select id="panelPos" aria-label="Panel position">
          <option value="right">Right</option>
          <option value="left">Left</option>
          <option value="bottom">Bottom</option>
          <option value="float">Floating</option>
          <option value="hidden">Hidden</option>
        </select>
        <button id="clearChat" class="ghost small" title="Start a fresh conversation">New chat</button>
      </div>
      <div id="messages"></div>
      <div id="actions"></div>
      <form id="composer">
        <textarea id="input" rows="1" placeholder="Ask about your page…" autocomplete="off"></textarea>
        <button type="submit" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </form>
      <div id="floatGrip" title="Drag to resize" aria-hidden="true"></div>
    </aside>
  </main>

  <div id="inkPop" class="popover" hidden>
    <div class="pop-section">
      <div class="pop-title">Thickness <span id="widthVal"></span></div>
      <div class="width-row">
        <span class="w-small"></span>
        <input type="range" id="widthRange" min="0.5" max="14" step="0.1" aria-label="Stroke thickness">
        <span class="w-large"></span>
      </div>
      <svg id="widthDemo" viewBox="0 0 240 44" aria-hidden="true"><path d="M12 30c30-26 52-26 70-8s44 18 66-6 50-14 80 2"/></svg>
      <div class="presets" id="widthPresets"></div>
    </div>
    <div class="pop-section">
      <div class="pop-title">Colour</div>
      <div class="palette" id="palette"></div>
      <label class="custom-color">
        <span class="spectrum"></span>
        <span>Any colour…</span>
        <input type="color" id="colorInput" aria-label="Pick any colour">
      </label>
    </div>
  </div>

  <div id="imgPop" class="popover menu" hidden>
    <button type="button" id="imgPaste"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1"/></svg><span>Paste image</span></button>
    <label class="menu-item"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg><span>Photo or file…</span><input type="file" id="imgFile" accept="image/*" multiple hidden></label>
    <div class="menu-hint">You can also press ⌘V with a keyboard, or drag an image onto the page.</div>
  </div>

  <div id="matPop" class="popover" hidden>
    <div class="pop-section">
      <div class="pop-title">This session's PDFs</div>
      <div id="matLocal" class="mat-list"></div>
      <label class="menu-item add-pdf"><span>＋ Add PDF to this session</span><input type="file" id="matFile" accept="application/pdf" multiple hidden></label>
      <div id="matProgress" class="muted small"></div>
    </div>
    <div class="pop-section">
      <div class="pop-title">Shared library <span class="muted">Settings → Library</span></div>
      <div id="matGlobal" class="mat-list"></div>
    </div>
  </div>

  <div id="eraserPop" class="popover" hidden>
    <div class="pop-section">
      <div class="pop-title">Eraser size <span id="eraserVal"></span></div>
      <div class="width-row">
        <span class="w-small"></span>
        <input type="range" id="eraserRange" min="4" max="90" step="1" aria-label="Eraser size">
        <span class="w-large"></span>
      </div>
      <div class="eraser-sizes" id="eraserPresets"></div>
    </div>
    <div class="pop-section">
      <div class="pop-title">Erases</div>
      <div class="segmented" id="eraserMode">
        <button type="button" data-mode="partial">Only what it touches</button>
        <button type="button" data-mode="stroke">Whole strokes</button>
      </div>
    </div>
  </div>

  <dialog id="settingsDlg"></dialog>
</body>
</html>
